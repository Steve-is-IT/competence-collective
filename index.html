<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Competence Collective</title>
<meta name="description" content="The Competence Collective is a cadre of experienced industry professionals who find the gaps others miss and build what fills them, with a focus on cybersecurity and education.">
<link rel="canonical" href="https://competencecollective.org/">
<meta name="theme-color" content="#0a0b0d">
<meta property="og:title" content="The Competence Collective">
<meta property="og:description" content="A cadre of experienced industry professionals who find the gaps others miss and build what fills them, with a focus on cybersecurity and education.">
<meta property="og:url" content="https://competencecollective.org/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23f2f4f7%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Arial,Helvetica,sans-serif%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27%230a0b0d%27%3E%3Ctspan font-weight=%27800%27%3EC%3C/tspan%3E%3Ctspan font-weight=%27400%27%3EC%3C/tspan%3E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=Inter:wght@300;400;600;800&display=swap">
<style>
  :root{
    --bg:#0a0b0d; --ink:#eef1f6; --muted:#8b93a1; --line:#23262e; --card:#111319;
    --accent:#8891ff;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
  a{color:inherit;text-decoration:none}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    text-align:center;padding:100px 24px 80px}
  /* logotype */
  .wordmark{font-weight:300;text-transform:uppercase;letter-spacing:.02em;line-height:1;
    white-space:nowrap;font-size:clamp(15px,4.2vw,38px)}
  .wordmark .hl{font-weight:800}
  .tagline{margin:30px auto 0;max-width:500px;color:var(--muted);font-size:16px;line-height:1.65}
  /* tiles */
  .tiles{margin-top:64px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
  .tile{width:280px;height:150px;display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    transition:border-color .18s ease,transform .12s ease,background .18s ease}
  .tile:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);
    transform:translateY(-3px);background:#14161d}
  .rh{display:flex;align-items:center;gap:12px;font-weight:700;font-size:21px;letter-spacing:-.01em}
  .hw{font-family:"Archivo",-apple-system,"Arial Black",sans-serif;font-weight:900;font-size:32px;letter-spacing:-.03em}
  .hw .dot{color:var(--muted)}
  footer{padding:32px 24px;text-align:center;color:var(--muted);font-size:13px;
    border-top:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <div class="wordmark">THE<span class="hl">COMPETENCE</span>COLLECTIVE</div>
  <p class="tagline">A cadre of experienced industry professionals who find the gaps others miss and build what fills them &mdash; with a focus on cybersecurity and education.</p>

  <div class="tiles">
    <a class="tile" href="https://redherrings.app" aria-label="Red Herrings">
      <span class="rh">
        <svg width="34" height="34" viewBox="5.1 3 58 58" aria-hidden="true"><path fill-rule="evenodd" d="M6 32c9-11 20-16 30-16C40 16 44 19 48 25C51 22 56.5 15.5 62.25 11.75C58.38 18.12 55.69 25.81 54.44 32C55.69 38.19 58.38 45.88 62.25 52.25C56.5 48.5 51 42 48 39C44 45 40 48 36 48c-10 0-21-5-30-16z M20 24.8a5.6 5.6 0 1 0 0 11.2 5.6 5.6 0 1 0 0-11.2z" fill="#E5382F"/><circle cx="20" cy="30.4" r="3.2" fill="none" stroke="#E5382F" stroke-width="2"/><path d="M23 33.4l4 4" stroke="#E5382F" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span>Red Herrings</span>
      </span>
    </a>
    <a class="tile" href="https://hotwa.sh" aria-label="Hotwash">
      <span class="hw">hotwa<span class="dot">.sh</span></span>
    </a>
  </div>
</main>

<footer>
  &copy; 2026 The Competence Collective, LLC
</footer>
</body>
</html>
