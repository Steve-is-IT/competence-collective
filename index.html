<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Competence Collective</title>
<meta name="description" content="The Competence Collective is an independent software studio building practical tools for serious technical work.">
<link rel="canonical" href="https://competencecollective.org/">
<meta name="theme-color" content="#0a0b0d">
<meta property="og:title" content="The Competence Collective">
<meta property="og:description" content="An independent software studio building practical tools for serious technical work.">
<meta property="og:url" content="https://competencecollective.org/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 32%27%3E%3Cg fill=%27none%27 stroke=%27%23eef1f6%27 stroke-width=%273%27%3E%3Ccircle cx=%2718%27 cy=%2716%27 r=%2712%27/%3E%3Ccircle cx=%2730%27 cy=%2716%27 r=%2712%27 stroke=%27%238891ff%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0a0b0d; --ink:#eef1f6; --muted:#8b93a1; --line:#23262e; --card:#111319;
    --accent:#8891ff;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
  a{color:inherit;text-decoration:none}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:96px 24px}
  /* logotype */
  .logo{display:flex;flex-direction:column;align-items:center;gap:26px}
  .mark{display:block}
  .wordmark{font-size:clamp(26px,5vw,42px);font-weight:600;letter-spacing:-.02em;line-height:1}
  .wordmark .the{display:block;font-size:.34em;font-weight:600;letter-spacing:.34em;
    text-transform:uppercase;color:var(--muted);margin-bottom:.9em}
  .tagline{margin:34px auto 0;max-width:440px;color:var(--muted);font-size:16px;line-height:1.6}
  /* tiles */
  .tiles{margin-top:72px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
  .tile{width:280px;height:150px;display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    transition:border-color .18s ease,transform .12s ease,background .18s ease}
  .tile:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);
    transform:translateY(-3px);background:#14161d}
  .rh{display:flex;align-items:center;gap:12px;font-weight:700;font-size:21px;letter-spacing:-.01em}
  footer{padding:32px 24px;text-align:center;color:var(--muted);font-size:13px;
    border-top:1px solid var(--line)}
  footer a:hover{color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="logo">
    <svg class="mark" width="112" height="72" viewBox="0 0 48 32" aria-hidden="true">
      <g fill="none" stroke-width="2.4">
        <circle cx="18" cy="16" r="12" stroke="var(--ink)"/>
        <circle cx="30" cy="16" r="12" stroke="var(--accent)"/>
      </g>
    </svg>
    <div class="wordmark"><span class="the">The</span>Competence Collective</div>
  </div>
  <p class="tagline">An independent software studio building practical tools for serious technical work.</p>

  <div class="tiles">
    <a class="tile" href="https://redherrings.app" aria-label="Red Herrings">
      <span class="rh">
        <svg width="34" height="34" viewBox="5.1 3 58 58" aria-hidden="true"><path fill-rule="evenodd" d="M6 32c9-11 20-16 30-16C40 16 44 19 48 25C51 22 56.5 15.5 62.25 11.75C58.38 18.12 55.69 25.81 54.44 32C55.69 38.19 58.38 45.88 62.25 52.25C56.5 48.5 51 42 48 39C44 45 40 48 36 48c-10 0-21-5-30-16z M20 24.8a5.6 5.6 0 1 0 0 11.2 5.6 5.6 0 1 0 0-11.2z" fill="#E5382F"/><circle cx="20" cy="30.4" r="3.2" fill="none" stroke="#E5382F" stroke-width="2"/><path d="M23 33.4l4 4" stroke="#E5382F" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span>Red Herrings</span>
      </span>
    </a>
  </div>
</main>

<footer>
  &copy; 2026 The Competence Collective, LLC &middot; <a href="mailto:hello@competencecollective.org">hello@competencecollective.org</a>
</footer>
</body>
</html>
